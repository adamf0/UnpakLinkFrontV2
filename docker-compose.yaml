version: '3.9'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SOURCE:fake
        VITE_GOOGLE_KEY:AIzaSyB7Yx4rOdZOKttiR9RppYw5Cxh6Scx5A0U
        VITE_BASEAPI:http://localhost:3000
        VITE_BASEURL:http://localhost:5173
    container_name: frontend
    image: frontend:0.1.0
    restart: always
    security_opt:
      - "no-new-privileges:true"
      - apparmor=docker-default
    ports:
      - "5173:5173"
    environment:
      - VITE_SOURCE=fake
      - VITE_GOOGLE_KEY=AIzaSyB7Yx4rOdZOKttiR9RppYw5Cxh6Scx5A0U
      - VITE_BASEAPI=http://localhost:3000
      - VITE_BASEURL=http://localhost:5173
    networks:
      - app-network

networks:
  app-network:
    driver: bridge